<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Find the BPC BW model in UJA_APPL</title>
  <desc id="desc">Use SAP GUI transaction SE11 to locate the BPC application and INFOCUBE.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1e293b" flood-opacity=".12"/></filter></defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <text x="90" y="88" fill="#172554" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="750">Find the BW Model · 定位 BW 模型</text>
  <text x="90" y="132" fill="#64748b" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">SAP GUI · SE11 · UJA_APPL</text>
  <g filter="url(#shadow)"><rect x="90" y="205" width="1420" height="430" rx="22" fill="#fff"/></g>
  <rect x="90" y="205" width="1420" height="78" rx="22" fill="#0f3b67"/><rect x="90" y="261" width="1420" height="22" fill="#0f3b67"/>
  <g fill="#fff" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="130" y="254" font-size="24" font-weight="700">SE11 · Table UJA_APPL</text><text x="1290" y="254" font-size="20">SAP BW</text></g>
  <g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22"><rect x="130" y="325" width="1340" height="58" fill="#e0f2fe"/><text x="160" y="362" fill="#0f172a" font-weight="700">APPSET_ID</text><text x="500" y="362" fill="#0f172a" font-weight="700">APPLICATION_ID</text><text x="920" y="362" fill="#0f172a" font-weight="700">INFOCUBE</text>
  <line x1="130" y1="383" x2="1470" y2="383" stroke="#cbd5e1" stroke-width="2"/><text x="160" y="437" fill="#0f172a">BPC420_00</text><text x="500" y="437" fill="#0f172a">Consolidation</text><text x="920" y="437" fill="#b45309" font-weight="750">/CPMB/FOITS7D</text>
  <line x1="130" y1="465" x2="1470" y2="465" stroke="#e2e8f0"/><text x="160" y="522" fill="#64748b">过滤条件：APPSET_ID = BPC420_00</text><text x="920" y="522" fill="#64748b">得到 BW 模型</text></g>
  <rect x="130" y="570" width="1340" height="34" rx="17" fill="#dcfce7"/><text x="800" y="594" text-anchor="middle" fill="#166534" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700">INFOCUBE 值用于在语义模型中选择对应的数据表</text>
</svg>