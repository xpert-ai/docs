<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">SAP BPC Consolidation model</title>
  <desc id="desc">Dimensions, measures and the Consolidation model used by the BPC report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f2f7ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e293b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <text x="90" y="88" fill="#172554" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="750">Consolidation Model · 合并模型</text>
  <text x="90" y="132" fill="#64748b" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">BPC420_00 / Consolidation 的核心分析结构</text>
  <g filter="url(#shadow)">
    <rect x="92" y="196" width="420" height="480" rx="22" fill="#fff" stroke="#dbeafe" stroke-width="3"/>
    <rect x="590" y="196" width="420" height="480" rx="22" fill="#fff" stroke="#ccfbf1" stroke-width="3"/>
    <rect x="1088" y="196" width="420" height="480" rx="22" fill="#fff" stroke="#fed7aa" stroke-width="3"/>
  </g>
  <g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="132" y="260" fill="#2563eb" font-size="23" font-weight="700">DIMENSIONS · 维度</text>
    <text x="132" y="327" fill="#0f172a" font-size="29" font-weight="700">Account</text><text x="132" y="357" fill="#64748b" font-size="20">资产负债表科目</text>
    <text x="132" y="414" fill="#0f172a" font-size="29" font-weight="700">Entity</text><text x="132" y="444" fill="#64748b" font-size="20">组织与公司</text>
    <text x="132" y="501" fill="#0f172a" font-size="29" font-weight="700">Time</text><text x="132" y="531" fill="#64748b" font-size="20">期间与日历</text>
    <text x="132" y="588" fill="#0f172a" font-size="29" font-weight="700">Category</text><text x="132" y="618" fill="#64748b" font-size="20">实际 / 预算 / 预测</text>
    <text x="630" y="260" fill="#0f766e" font-size="23" font-weight="700">MEASURES · 度量</text>
    <text x="630" y="342" fill="#0f172a" font-size="27" font-weight="700">/CPMB/SDATA</text><text x="630" y="374" fill="#64748b" font-size="20">源系统金额</text>
    <text x="630" y="445" fill="#0f172a" font-size="27" font-weight="700">Amount</text><text x="630" y="477" fill="#64748b" font-size="20">计算度量：取负展示</text>
    <rect x="630" y="534" width="330" height="78" rx="14" fill="#ecfdf5"/><text x="654" y="582" fill="#047857" font-size="24" font-weight="700">语义增强 · Semantic</text>
    <text x="1128" y="260" fill="#c2410c" font-size="23" font-weight="700">MODEL · 模型</text>
    <text x="1128" y="356" fill="#0f172a" font-size="32" font-weight="750">Consolidation</text>
    <text x="1128" y="401" fill="#64748b" font-size="21">/CPMB/FOITS7D</text>
    <line x1="1128" y1="444" x2="1468" y2="444" stroke="#e2e8f0" stroke-width="2"/>
    <text x="1128" y="496" fill="#475569" font-size="21">MDX Cube</text><text x="1128" y="540" fill="#475569" font-size="21">Calendar hierarchy</text><text x="1128" y="584" fill="#475569" font-size="21">Calculated members</text>
