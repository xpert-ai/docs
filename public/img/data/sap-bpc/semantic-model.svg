<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Create the semantic model entity</title>
  <desc id="desc">Drag the BW model table into the MDX model area and enrich its semantic metadata.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1e1b4b" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/></marker></defs>
  <rect width="1600" height="780" rx="28" fill="url(#bg)"/>
  <text x="90" y="88" fill="#172554" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="750">Semantic Model Workspace · 语义模型工作区</text>
  <text x="90" y="132" fill="#64748b" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">Drag the source table into the MDX model and enrich metadata</text>
  <g filter="url(#shadow)"><rect x="90" y="205" width="390" height="440" rx="20" fill="#fff"/><rect x="605" y="205" width="390" height="440" rx="20" fill="#fff"/><rect x="1120" y="205" width="390" height="440" rx="20" fill="#fff"/></g>
  <path d="M480 425 H605" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/><path d="M995 425 H1120" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/>
  <g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="130" y="270" fill="#2563eb" font-size="23" font-weight="700">SOURCE TABLE · 源表</text><text x="130" y="352" fill="#0f172a" font-size="28" font-weight="750">/CPMB/FOITS7D</text><text x="130" y="397" fill="#64748b" font-size="21">SAP BW InfoCube</text><text x="130" y="465" fill="#475569" font-size="21">Account</text><text x="130" y="508" fill="#475569" font-size="21">Entity</text><text x="130" y="551" fill="#475569" font-size="21">Time</text><text x="130" y="594" fill="#475569" font-size="21">/CPMB/SDATA</text>
  <text x="645" y="270" fill="#7c3aed" font-size="23" font-weight="700">MDX MODEL · 多维模型</text><text x="645" y="360" fill="#0f172a" font-size="32" font-weight="750">Consolidation</text><text x="645" y="413" fill="#64748b" font-size="21">Cube entity</text><rect x="645" y="472" width="310" height="88" rx="14" fill="#f5f3ff"/><text x="670" y="525" fill="#6d28d9" font-size="22" font-weight="700">Calendar + measures</text>
  <text x="1160" y="270" fill="#0f766e" font-size="23" font-weight="700">SEMANTICS · 语义增强</text><text x="1160" y="354" fill="#0f172a" font-size="28" font-weight="750">Business metadata</text><text x="1160" y="414" fill="#475569" font-size="21">默认时间层级</text><text x="1160" y="457" fill="#475569" font-size="21">计算度量 Amount</text><text x="1160" y="500" fill="#475569" font-size="21">指标与业务域</text><rect x="1160" y="548" width="280" height="48" rx="24" fill="#dcfce7"/><text x="1300" y="579" text-anchor="middle" fill="#166534" font-size="19" font-weight="700">可查询 · 可分析</text></g>
