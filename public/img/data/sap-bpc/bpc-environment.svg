    <text x="145" y="377" font-size="44" font-weight="750">BPC420_00</text>
    <text x="145" y="425" font-size="25" opacity=".9">Personal Edition</text>
    <text x="665" y="302" font-size="22" opacity=".82">MODEL · 模型</text>
    <text x="665" y="377" font-size="44" font-weight="750">Consolidation</text>
    <text x="665" y="425" font-size="25" opacity=".9">财务合并模型</text>
    <text x="1185" y="302" font-size="22" opacity=".82">OUTPUT · 输出</text>
    <text x="1185" y="377" font-size="38" font-weight="750">Financial Reports</text>
    <text x="1185" y="425" font-size="25" opacity=".9">财务合并报表</text>
  </g>
  <g fill="#fff" opacity=".86"><circle cx="147" cy="477" r="7"/><circle cx="170" cy="477" r="7"/><circle cx="193" cy="477" r="7"/><circle cx="667" cy="477" r="7"/><circle cx="690" cy="477" r="7"/><circle cx="713" cy="477" r="7"/><circle cx="1187" cy="477" r="7"/><circle cx="1210" cy="477" r="7"/><circle cx="1233" cy="477" r="7"/></g>
  <text x="800" y="650" text-anchor="middle" fill="#475569" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">SAP BPC → BW 模型 → 语义分析</text>
