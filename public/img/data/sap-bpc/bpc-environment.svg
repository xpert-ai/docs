<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">SAP BPC environment</title>
  <desc id="desc">BPC420_00 environment, Consolidation model and financial consolidation reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f8ff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="env" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5b5ce2"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f8c"/><stop offset="1" stop-color="#0ea5a8"/></linearGradient>
    <linearGradient id="report" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e06b2c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#172554" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1600" height="760" rx="28" fill="url(#bg)"/>
  <text x="96" y="92" fill="#172554" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="750">SAP BPC Environment · BPC 环境</text>
  <text x="96" y="136" fill="#64748b" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-size="22">From the BPC environment to a governed consolidation report</text>
  <path d="M485 385 H595" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/>
  <path d="M1005 385 H1115" stroke="#64748b" stroke-width="6" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="105" y="235" width="380" height="300" rx="24" fill="url(#env)"/>
    <rect x="625" y="235" width="380" height="300" rx="24" fill="url(#model)"/>
    <rect x="1145" y="235" width="380" height="300" rx="24" fill="url(#report)"/>
  </g>
  <g fill="#fff" font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
